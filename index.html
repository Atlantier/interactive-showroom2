<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04060b" />
    <!-- The stylesheet and the JS bundle are separate requests. Without this the
         document paints white for that gap, which is a visible flash on a page
         whose entire identity is deep space. -->
    <style>
      html,
      body {
        background: #04060b;
      }
    </style>
    <meta
      name="description"
      content="An immersive personal showroom built with React 19, Three.js and Lenis: scroll-driven camera choreography, real-time GPU particles and physics sandboxes."
    />
    <title>Digital Showroom — Real-time Graphics Engineering</title>

    <!--
      The static document is written in the DEFAULT locale (English). The runtime
      rewrites lang/title/description from the dictionary on first paint, but
      crawlers and no-JS readers only ever see this. It used to say zh-CN here while
      the app defaulted to English, which is a 3.1.1 Language-of-Page mismatch.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://atlantier.github.io/interactive-showroom2/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Digital Showroom" />
    <meta property="og:title" content="Digital Showroom — Real-time Graphics Engineering" />
    <meta
      property="og:description"
      content="Scroll-driven camera choreography, real-time GPU particles, Verlet and FABRIK physics sandboxes — built with React 19, three.js and Lenis."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Digital Showroom — Real-time Graphics Engineering" />
    <meta
      name="twitter:description"
      content="An immersive personal showroom: one clock drives the page, the camera and the GPU."
    />

    <!--
      Fonts are self-hosted (src/styles/fonts.css, 62 KB of latin-subset variable WOFF2).

      This used to be three requests to fonts.googleapis.com / fonts.gstatic.com: two
      preconnects, two TLS handshakes and a render-blocking stylesheet from a third party
      before any text could be painted. On a network where that host is unreachable the
      stylesheet stalls until timeout and the page visibly reflows when it finally gives up.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

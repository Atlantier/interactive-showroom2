# ─────────────────────────────────────────────────────────────────────────────
# Deploy the showroom to GitHub Pages.
#
# Trigger: every push to `main`, plus manual runs from the Actions tab.
#
# The pipeline is deliberately split into two jobs so that the things that can
# fail fast (install, typecheck, build) are separated from the thing that
# mutates production (publish). A type error therefore never reaches the deploy
# step, and the deploy job only starts once a verified `dist/` artifact exists.
#
# One-time repository setup:
#   Settings → Pages → Build and deployment → Source: **GitHub Actions**
# Without that, `actions/deploy-pages` has nowhere to publish and fails with
# "Get Pages site failed".
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy without an empty commit (e.g. after changing Pages config).
  workflow_dispatch:

# Least privilege. `pages: write` + `id-token: write` are what the Pages
# deployment action exchanges for its publish token; nothing here needs write
# access to the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue the newest run and let an in-flight publish
# finish rather than cancelling it mid-upload, which can leave Pages serving a
# half-written artifact.
concurrency:
  group: pages
  cancel-in-progress: false

# ── Actions are pinned to commit SHAs, not movable tags ─────────────────────
# A tag is a pointer the action's owner can move: `@v4` means "whatever v4 points at
# when this job runs", so a compromised or retagged upstream changes what executes in
# this repo's deploy job with no diff to review. Each pin below is the commit that its
# tag resolved to on 2026-11-02, with the tag kept in a comment so a human can still see
# which major line it is. Bump by re-resolving the tag, never by editing the number.

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Build: install → typecheck → build → upload the artifact
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Must run before setup-node: `cache: pnpm` shells out to pnpm to locate
      # the store directory, and fails if the binary is not on PATH yet.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # Pinned to the version that authored pnpm-lock.yaml. The lockfile is
          # format v9.0 (readable by pnpm 9+), but pinning the EXACT resolver is
          # what makes CI resolve the tree the same way local `pnpm install` did
          # — the cheapest defence against "works on my machine".
          version: '11.8.0'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Vite 8 requires ^20.19 || >=22.12. Node 22 LTS satisfies it.
          node-version: 22
          # Keyed on pnpm-lock.yaml, so an unchanged lockfile restores the whole
          # store in a few seconds instead of re-resolving the tree.
          cache: pnpm

      - name: Install dependencies
        # `--frozen-lockfile` fails if package.json and the lockfile disagree,
        # which is the CI-safe behaviour: never silently resolve a different tree
        # than the one that was tested locally.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # Runs `tsc -b --noEmit` across the app and node projects. Kept as its own
        # step so a type error is reported as a red "Typecheck" check rather than
        # being buried inside a failed build log. (`pnpm build` re-checks anyway —
        # the build script is `tsc -b && vite build` — but fail-fast is worth the
        # duplicated pass.)
        run: pnpm typecheck

      - name: Lint & format
        # `--max-warnings=12` is a RATCHET, not a target: the open warnings are all
        # `react-hooks/exhaustive-deps` in effects that deliberately run once (a lazily-created
        # fixed-step clock, refs read 60 times a second). It came down from 13 when the dead
        # ripple pool was deleted. The number may go down; if it goes up, a new warning slipped
        # in and this fails.
        run: |
          pnpm lint
          pnpm format:check

      - name: Unit tests
        # The pure-logic layer: spring, Verlet, FABRIK, fuzzy matcher, palette tables.
        # No browser, no build output needed, ~0.4 s -- so it runs before the expensive
        # steps and fails fast on a logic regression.
        run: pnpm test

      - name: Verify selftest
        # Proves the probe verdict contract still bites: it spawns node five times and
        # asserts on exit codes (clean -> 0, exception/console.error/fatal/assertion -> 1).
        # No browser, no preview server, ~0.5 s -- so it runs before anything expensive.
        run: pnpm verify:selftest

      - name: Resolve Pages base path
        # GitHub Pages serves project sites from /<repo>/, user/organisation sites
        # from /. Vite reads this at config time (see vite.config.ts).
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo_name" == *.github.io ]]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/${repo_name}/" >> "$GITHUB_ENV"
          fi
          echo "Using base path: ${VITE_BASE_PATH:-}"

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      # Budget runs in THIS job on purpose. A separate job would re-install
      # dependencies and re-build (minutes of CI time) just to read dist/.
      - name: Critical-path budget
        # `pipefail` matters: without it the exit status is `tee`'s, so a budget breach
        # would be written to the summary and the step would still be green.
        run: |
          set -o pipefail
          pnpm verify:budget | tee budget.txt
          {
            echo '### Critical-path budget'
            echo ''
            echo '```'
            cat budget.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Accessibility assertions run against the BUILT output, not the dev server.
      # `setup-chrome` exports CHROME_PATH, which is what the script looks for.
      # NOTE: these actions still use movable tags; pinning them to SHAs is UI-17.
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1

      - name: Accessibility assertions
        env:
          # The action exports its path as an output, not as CHROME_PATH.
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          pnpm preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          pnpm verify:a11y --base http://127.0.0.1:4173

      - name: Visual regression (UI layer)
        # Compares six scroll positions against visual-baselines/. The baselines were captured
        # on Windows, and headless Chromium does not rasterise the same pixels on Linux, so on
        # this runner the script prints a skip reason and exits 0 -- failing instead would be a
        # red build for a platform difference. It gates locally, which is where UI changes are
        # made; capture Linux baselines inside this image when that coverage is wanted.
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm verify:visual --base http://127.0.0.1:4173

      - name: Scene probes (architecture, sandbox, fabrik)
        # D4's incremental CI adoption: these three were the last of the review's "22 scripts that
        # never run in CI". Unlike the gates above they connect to a CDP endpoint instead of
        # launching a browser, so the step starts one and points them at it.
        #
        # They are structure and behaviour assertions, not pixel comparisons, so a software
        # rasteriser is fine -- and each one now fails when it cannot find what it came to
        # measure (findMissing), which is what made them safe to gate on.
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CDP_HTTP: http://127.0.0.1:9411
        run: |
          set -euo pipefail
          # The runner has no GPU, and the first attempt at this step proved the architecture
          # probe correctly reports `A3_canvas: {found: false}` there rather than passing on a
          # canvas that never initialised. Software WebGL has to be requested explicitly on
          # modern Chrome, so the probe gets a real GL context and measures the real scene.
          "$CHROME_PATH" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
            --remote-debugging-port=9411 --user-data-dir=/tmp/probe-chrome about:blank &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9411/json/version > /dev/null && break
            sleep 1
          done
          # Fail fast and clearly if software WebGL is still unavailable: otherwise the
          # architecture probe reports a missing canvas and it reads like an app bug.
          node scripts/check-webgl.mjs
          node scripts/verify-architecture.mjs http://127.0.0.1:4173
          node scripts/verify-sandbox.mjs http://127.0.0.1:4173
          node scripts/verify-fabrik.mjs http://127.0.0.1:4173

      - name: Context-loss notice (real lost/restored WebGL context)
        # CR-12 / SH-11: the app had no `webglcontextlost` handling anywhere, so a driver reset or a
        # switch between GPUs left a black canvas with nothing in the interface to explain it. This
        # probe takes a REAL context away with `WEBGL_lose_context`, asserts the notice appears with
        # the dictionary's wording and is announced once, that it survives a partial restore, and
        # that it clears only when the last context comes back. It launches its own browser (with
        # SwiftShader on this GPU-less runner) instead of using the CDP endpoint above.
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm verify:context --base http://127.0.0.1:4173

      - name: Verify build output
        # A build that silently emits nothing (or only the HTML shell) would
        # deploy a blank page. Fail loudly here instead of after publishing.
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          js_count=$(find dist -name '*.js' | wc -l)
          css_count=$(find dist -name '*.css' | wc -l)
          echo "bundles: ${js_count} js, ${css_count} css"
          test "$js_count" -gt 0 || { echo "::error::no JS bundle emitted"; exit 1; }
          echo "dist size: $(du -sh dist | cut -f1)"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  # ───────────────────────────────────────────────────────────────────────────
  # Deploy: publish the verified artifact
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Surfaces the live URL on the Actions run summary.
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
